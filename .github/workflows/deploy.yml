name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 校验手写加密实现
        run: node src/crypto.test.mjs

      - name: 确保 R2 缓存桶存在
        run: |
          if ! npx wrangler r2 bucket list | grep -q "jm-bot-cache"; then
            npx wrangler r2 bucket create jm-bot-cache
          fi

      - name: 同步密钥
        env:
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_CLIENT_SECRET: ${{ secrets.QQ_CLIENT_SECRET }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
        run: |
          if [ -n "$QQ_APP_ID" ]; then
            printf '%s' "$QQ_APP_ID" | npx wrangler secret put QQ_APP_ID
          fi
          if [ -n "$QQ_CLIENT_SECRET" ]; then
            printf '%s' "$QQ_CLIENT_SECRET" | npx wrangler secret put QQ_CLIENT_SECRET
          fi
          if [ -n "$LINK_SECRET" ]; then
            printf '%s' "$LINK_SECRET" | npx wrangler secret put LINK_SECRET
          fi

      - name: 部署 Worker
        run: npx wrangler deploy
